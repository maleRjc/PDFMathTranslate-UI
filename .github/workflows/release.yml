name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.9.12)"
        required: true
        default: "v1.9.12"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python Wheel and Source Distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/release
          cd dist/release
          sha256sum *.whl *.tar.gz > SHA256SUMS-python.txt

      - name: Fetch locally signed macOS release assets (if pushed on release-assets branch)
        continue-on-error: true
        run: |
          git fetch origin release-assets:refs/remotes/origin/release-assets || true
          if git rev-parse --verify origin/release-assets >/dev/null 2>&1; then
            mkdir -p /tmp/signed_assets
            git archive origin/release-assets | tar -x -C /tmp/signed_assets
            if ls /tmp/signed_assets/PDFMathTranslate-*.dmg.part* >/dev/null 2>&1; then
              cat /tmp/signed_assets/PDFMathTranslate-*.dmg.part* > dist/release/PDFMathTranslate-v1.9.12-macOS-arm64.dmg
            fi
            if ls /tmp/signed_assets/PDFMathTranslate-*.zip.part* >/dev/null 2>&1; then
              cat /tmp/signed_assets/PDFMathTranslate-*.zip.part* > dist/release/PDFMathTranslate-v1.9.12-macOS-arm64.zip
            fi
            if [ -f /tmp/signed_assets/pdf2zh-1.9.12-py3-none-any.whl ]; then
              cp /tmp/signed_assets/pdf2zh-1.9.12-py3-none-any.whl dist/release/
            fi
            if [ -f /tmp/signed_assets/pdf2zh-1.9.12.tar.gz ]; then
              cp /tmp/signed_assets/pdf2zh-1.9.12.tar.gz dist/release/
            fi
            if [ -f /tmp/signed_assets/SHA256SUMS.txt ]; then
              cp /tmp/signed_assets/SHA256SUMS.txt dist/release/SHA256SUMS.txt
              rm -f dist/release/SHA256SUMS-python.txt
            fi
            ls -lh dist/release/
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "PDFMathTranslate-UI ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            > **📌 项目来源与开源致谢 (Upstream Attribution)**：本项目衍生自上游开源项目 [PDFMathTranslate/PDFMathTranslate](https://github.com/PDFMathTranslate/PDFMathTranslate)，在其核心学术 PDF 翻译引擎基础上进行了原生桌面客户端（PySide6 UI）改造与排版增强，继续遵循 AGPL-3.0 开源协议。

            ## ✨ 新增功能与改进 (Highlights)
            1. **原生跨平台桌面客户端 (PySide6 Desktop UI)**
               - 内置 **24 种主流 AI 大模型与机器翻译服务商**可视化配置（DeepSeek、OpenAI、Gemini、阿里云百炼 Qwen-MT、硅基流动、智谱 GLM、ModelScope、Ollama 本地模型、自定义 OpenAI 兼容接口等），支持一键测试连接与设为默认。
               - 内置 **高清双语/单语/原文三合一 PDF 阅读器**，支持拖拽批量导入 PDF / Word 文档、文件夹与在线论文链接（如 arXiv）。
               - 内置 **交互式使用说明与常见问题指南 (User Guide)**。
            2. **10 国语言界面实时无缝切换 (Real-time 10-Language UI)**
               - 完整覆盖：**简体中文 (`zh`)**、**繁體中文 (`zh-TW`)**、**English (`en`)**、**日本語 (`ja`)**、**한국어 (`ko`)**、**Français (`fr`)**、**Deutsch (`de`)**、**Русский (`ru`)**、**Español (`es`)**、**Italiano (`it`)**。
            3. **PDF 目录 (Table of Contents) 排版精准还原**
               - 自动识别带引导点（`. . . . 42`）及宽间距目录行，逐行独立排版，动态裁剪/延展引导点并保持右侧页码原坐标精确对齐。
            4. **跨页程序代码块防乱码与行号保护**
               - 自动隔离跨页提示（`continued from previous page` / `continues on next page`），将带行号或语法高亮的程序代码行作为原子整体原位保留，彻底解决新页面程序代码混排乱码问题。
            5. **支持多语言推广页脚与可点击链接**
               - 生成的 PDF 末尾支持多语言对应推广语与超链接。

            ## 📦 发行包说明 (Release Assets)
            - **`PDFMathTranslate-v1.9.12-macOS-arm64.dmg`**：macOS (Apple Silicon) 独立安装包，已使用 **Apple Developer ID Application** 证书签名。
            - **`PDFMathTranslate-v1.9.12-macOS-arm64.zip`**：macOS 便携版 `.app` 压缩包（已签名）。
            - **`pdf2zh-1.9.12-py3-none-any.whl` / `pdf2zh-1.9.12.tar.gz`**：Python 安装包与源码包。
          files: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/SHA256SUMS*

